services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-site_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}
      POSTGRES_DB: ${POSTGRES_DB:-site_parser}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-site_parser} -d ${POSTGRES_DB:-site_parser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo 'backend migrations applied'"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m

  backend-crawler:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./crawler"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m

  backend-notifier:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./notifier"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m

  ai-service:
    profiles:
      - workers
    image: ${AI_IMAGE:-siteparserforfreelans-ai-runtime:local}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    command: ["python", "cmd/consumer/main.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_REQUIRE_LOCAL: "1"
      AI_READY_FILE: /tmp/ai-consumer-ready
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-consumer-ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0700,size=64m

  ollama:
    profiles:
      - workers
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  ai-user-embed:
    image: ${AI_IMAGE:-siteparserforfreelans-ai-runtime:local}
    profiles:
      - ai-user-embed
    command: ["python", "cmd/user_embed_consumer/main.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_REQUIRE_LOCAL: "1"
      AI_READY_FILE: /tmp/ai-user-embed-ready
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-user-embed-ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0700,size=64m

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_URL: http://backend-api:8080
    depends_on:
      backend-api:
        condition: service_started
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /home/app:mode=0700,size=16m

volumes:
  postgres_data:
  ollama_data:
