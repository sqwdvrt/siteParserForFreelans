services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
    environment:
      BACKEND_API_METRICS_TARGET: "${BACKEND_API_METRICS_TARGET:-backend-api:8080}"
      BACKEND_API_METRICS_SCHEME: "${BACKEND_API_METRICS_SCHEME:-http}"
      BACKEND_API_METRICS_TLS_INSECURE_SKIP_VERIFY: "${BACKEND_API_METRICS_TLS_INSECURE_SKIP_VERIFY:-false}"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/prometheus-entrypoint.sh
    volumes:
      - ./monitoring/prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/render_config.sh:/usr/local/bin/render-prometheus-config.sh:ro
      - ./monitoring/prometheus/docker-entrypoint.sh:/usr/local/bin/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-1g}
          cpus: '1.0'
        reservations:
          memory: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles:
      - monitoring
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ID: "${TELEGRAM_ID:-}"
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: "${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}"
      ALERTMANAGER_TELEGRAM_CHAT_ID: "${ALERTMANAGER_TELEGRAM_CHAT_ID:-}"
      ALERTMANAGER_SLACK_WEBHOOK_URL: "${ALERTMANAGER_SLACK_WEBHOOK_URL:-}"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/alertmanager-entrypoint.sh
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./monitoring/alertmanager/render_config.sh:/usr/local/bin/render-alertmanager-config.sh:ro
      - ./monitoring/alertmanager/docker-entrypoint.sh:/usr/local/bin/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:size=1m,mode=1777
    ports:
      - "${ALERTMANAGER_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
        reservations:
          memory: 32m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles:
      - monitoring
    command:
      - --redis.addr=${REDIS_EXPORTER_REDIS_ADDR:-${REDIS_URL:-redis://redis:6379}}
      - --check-keys=${REDIS_EXPORTER_CHECK_KEYS:-ai-process,ai-process:processing,ai-process:dlq,user-embed,user-embed:processing,user-embed:dlq,user-rematch,user-rematch:processing,user-rematch:dlq,ac-batch,ac-batch:processing,ac-batch:dlq,match-notify,match-notify:processing,match-notify:dlq}
      - --tls-ca-cert-file=/certs/ca.crt
      - -skip-tls-verification=false
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.1'
        reservations:
          memory: 16m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:?set_POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.1'
        reservations:
          memory: 32m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set_GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/api-overview.json
      POSTGRES_DB: "${POSTGRES_DB:-site_parser}"
      POSTGRES_USER: "${POSTGRES_USER:-site_parser}"
      POSTGRES_PASSWORD: "${GRAFANA_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}}"
      GRAFANA_POSTGRES_HOST: "${GRAFANA_POSTGRES_HOST:-postgres}"
      GRAFANA_POSTGRES_PORT: "${GRAFANA_POSTGRES_PORT:-5432}"
      GRAFANA_POSTGRES_SSLMODE: "${GRAFANA_POSTGRES_SSLMODE:-disable}"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-512m}
          cpus: '1.0'
        reservations:
          memory: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles:
      - monitoring
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.1'
        reservations:
          memory: 16m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
