services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend-api:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles:
      - monitoring
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ID: "${TELEGRAM_ID:-}"
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: "${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}"
      ALERTMANAGER_TELEGRAM_CHAT_ID: "${ALERTMANAGER_TELEGRAM_CHAT_ID:-}"
      ALERTMANAGER_SLACK_WEBHOOK_URL: "${ALERTMANAGER_SLACK_WEBHOOK_URL:-}"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/alertmanager-entrypoint.sh
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./monitoring/alertmanager/render_config.sh:/usr/local/bin/render-alertmanager-config.sh:ro
      - ./monitoring/alertmanager/docker-entrypoint.sh:/usr/local/bin/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:size=1m,mode=1777
    ports:
      - "${ALERTMANAGER_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles:
      - monitoring
    command:
      - --redis.addr=${REDIS_EXPORTER_REDIS_ADDR:-redis://redis:6379}
      - --check-keys=${REDIS_EXPORTER_CHECK_KEYS:-ai-process,ai-process:processing,ai-process:dlq,user-embed,user-embed:processing,user-embed:dlq,ac-batch,ac-batch:processing,ac-batch:dlq,match-notify,match-notify:processing,match-notify:dlq}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-site_parser}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/${POSTGRES_DB:-site_parser}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/api-overview.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
