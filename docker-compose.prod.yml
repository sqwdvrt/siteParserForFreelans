services:
  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      RUN_MIGRATIONS: "1"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m
    restart: "no"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./api"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      API_ADDR: ${API_ADDR:-:8443}
      API_TLS_CERT_FILE: ${API_TLS_CERT_FILE:-/run/secrets/api_tls_cert.pem}
      API_TLS_KEY_FILE: ${API_TLS_KEY_FILE:-/run/secrets/api_tls_key.pem}
      RUN_MIGRATIONS: "0"
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8443}:8443"
    volumes:
      - "${API_TLS_CERT_HOST_PATH:?set_API_TLS_CERT_HOST_PATH}:/run/secrets/api_tls_cert.pem:ro"
      - "${API_TLS_KEY_HOST_PATH:?set_API_TLS_KEY_HOST_PATH}:/run/secrets/api_tls_key.pem:ro"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./crawler"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      RUN_MIGRATIONS: "0"
      CRAWLER_HEALTH_ADDR: ":8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-notifier:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./notifier"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      RUN_MIGRATIONS: "0"
      NOTIFIER_HEALTH_ADDR: ":8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/app:mode=0700,size=16m
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-service:
    image: ${AI_IMAGE:-siteparserforfreelans-ai-runtime:prod}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    command: ["python", "cmd/consumer/main.py"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      EMBEDDING_REQUIRE_LOCAL: "1"
      AI_READY_FILE: /tmp/ai-consumer-ready
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-consumer-ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${AI_MEM_LIMIT:-2g}
        reservations:
          memory: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0700,size=64m
    restart: unless-stopped

  ai-user-embed:
    image: ${AI_IMAGE:-siteparserforfreelans-ai-runtime:prod}
    profiles:
      - ai-user-embed
    command: ["python", "cmd/user_embed_consumer/main.py"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      EMBEDDING_REQUIRE_LOCAL: "1"
      AI_READY_FILE: /tmp/ai-user-embed-ready
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-user-embed-ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${AI_MEM_LIMIT:-2g}
        reservations:
          memory: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0700,size=64m
    restart: unless-stopped

  ai-ac-consumer:
    image: ${AI_IMAGE:-siteparserforfreelans-ai-runtime:prod}
    command: ["python", "cmd/ac_consumer/main.py"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL_in_.env.production}
      REDIS_URL: ${REDIS_URL:?set_REDIS_URL_in_.env.production}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AI_READY_FILE: /tmp/ai-ac-consumer-ready
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-ac-consumer-ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${AI_MEM_LIMIT:-2g}
        reservations:
          memory: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0700,size=64m
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      API_URL: ${API_URL:?set_HTTPS_API_URL_in_.env.production}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /home/app:mode=0700,size=16m
    restart: unless-stopped
