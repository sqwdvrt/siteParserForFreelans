version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    paths:
      - .gomodcache
      - .gomodcache-local
      - .gomodcache-docker
      - .gocache
