# SLO recording rules for SiteParser backend API.
#
# SLO targets (30-day window):
#   Availability : error rate  < 1%   (error budget  = 0.01)
#   Latency      : p95         < 500ms (latency budget = 0.05, i.e. ≤5% requests may exceed 500ms)
#
# Naming convention: siteparser:<signal>:<aggregation_window>
# Windows 1m / 5m cover the "page" (critical) burn-rate pair.
# Windows 5m / 30m cover the "ticket" (high) burn-rate pair.
# Windows 30m / 6h  cover the "slow-burn" (warning) pair.

groups:
  # -------------------------------------------------------------------------
  # Worker health ratios  — crawler windows are wide because default cron is
  # daily; notifier windows are short because it runs continuously.
  # -------------------------------------------------------------------------
  - name: siteparser-worker-recording
    rules:
      - record: siteparser:crawler_failure_ratio:increase36h
        expr: |
          sum(increase(siteparser_crawler_runs_total{job="backend-crawler",status="failed"}[36h]))
          /
          clamp_min(sum(increase(siteparser_crawler_runs_total{job="backend-crawler"}[36h])), 1)

      - record: siteparser:crawler_interrupted_ratio:increase36h
        expr: |
          sum(increase(siteparser_crawler_runs_total{job="backend-crawler",status="interrupted"}[36h]))
          /
          clamp_min(sum(increase(siteparser_crawler_runs_total{job="backend-crawler"}[36h])), 1)

      - record: siteparser:crawler_successful_runs:increase36h
        expr: |
          sum(increase(siteparser_crawler_runs_total{job="backend-crawler",status="success"}[36h]))

      - record: siteparser:crawler_jobs_scraped:increase36h
        expr: |
          sum(increase(siteparser_crawler_jobs_scraped_total{job="backend-crawler"}[36h]))

      - record: siteparser:notifier_failure_ratio:rate5m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[5m]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[5m])), 0.001)

      - record: siteparser:notifier_failure_ratio:rate15m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[15m]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[15m])), 0.001)

      - record: siteparser:notifier_sent_rate:rate15m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="sent"}[15m]))

  # -------------------------------------------------------------------------
  # SLO burn-rate recording rules for Crawler/Notifier/AI services
  #
  # Crawler SLO (30-day window):
  #   Availability: 99% success rate (error budget = 1%)
  # Notifier SLO (30-day window):
  #   Availability: 99% success rate (error budget = 1%)
  # AI Service SLO (30-day window):
  #   Availability: 95% success rate without fallback (error budget = 5%)
  #
  # Three burn-rate levels per service:
  #   page      (critical) : burn ≥ 14.4× — consumes 2% of budget in 1 h
  #   ticket    (warning)  : burn ≥  6×   — consumes 5% of budget in 6 h
  #   slow-burn (warning)  : burn ≥  1×   — consumes 10% of budget in 3 d
  # -------------------------------------------------------------------------
  - name: siteparser-crawler-slo-recording
    rules:
      # Crawler error ratio = failed runs / total runs
      - record: siteparser:crawler_error_ratio:rate1m
        expr: |
          sum(rate(siteparser_crawler_runs_total{job="backend-crawler",status="failed"}[1m]))
          /
          clamp_min(sum(rate(siteparser_crawler_runs_total{job="backend-crawler"}[1m])), 0.001)

      - record: siteparser:crawler_error_ratio:rate5m
        expr: |
          sum(rate(siteparser_crawler_runs_total{job="backend-crawler",status="failed"}[5m]))
          /
          clamp_min(sum(rate(siteparser_crawler_runs_total{job="backend-crawler"}[5m])), 0.001)

      - record: siteparser:crawler_error_ratio:rate30m
        expr: |
          sum(rate(siteparser_crawler_runs_total{job="backend-crawler",status="failed"}[30m]))
          /
          clamp_min(sum(rate(siteparser_crawler_runs_total{job="backend-crawler"}[30m])), 0.001)

      - record: siteparser:crawler_error_ratio:rate6h
        expr: |
          sum(rate(siteparser_crawler_runs_total{job="backend-crawler",status="failed"}[6h]))
          /
          clamp_min(sum(rate(siteparser_crawler_runs_total{job="backend-crawler"}[6h])), 0.001)

  - name: siteparser-notifier-slo-recording
    rules:
      # Notifier error ratio = failed notifications / total notifications
      - record: siteparser:notifier_error_ratio:rate1m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[1m]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[1m])), 0.001)

      - record: siteparser:notifier_error_ratio:rate5m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[5m]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[5m])), 0.001)

      - record: siteparser:notifier_error_ratio:rate30m
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[30m]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[30m])), 0.001)

      - record: siteparser:notifier_error_ratio:rate6h
        expr: |
          sum(rate(siteparser_notifier_notifications_total{job="backend-notifier",status="failed"}[6h]))
          /
          clamp_min(sum(rate(siteparser_notifier_notifications_total{job="backend-notifier"}[6h])), 0.001)

  - name: siteparser-ai-slo-recording
    rules:
      # AI classifier fallback ratio = fallback calls / total calls
      - record: siteparser:ai_classifier_fallback_ratio:rate1m
        expr: |
          sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[1m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-service", pipeline="classifier"}[1m]))
            +
            sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[1m])),
            0.001
          )

      - record: siteparser:ai_classifier_fallback_ratio:rate5m
        expr: |
          sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[5m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-service", pipeline="classifier"}[5m]))
            +
            sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[5m])),
            0.001
          )

      - record: siteparser:ai_classifier_fallback_ratio:rate30m
        expr: |
          sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[30m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-service", pipeline="classifier"}[30m]))
            +
            sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[30m])),
            0.001
          )

      - record: siteparser:ai_classifier_fallback_ratio:rate6h
        expr: |
          sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[6h]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-service", pipeline="classifier"}[6h]))
            +
            sum(rate(ai_llm_fallback_total{job="ai-service", pipeline="classifier"}[6h])),
            0.001
          )

      # AI actor failure ratio = failure outcomes / total primary calls
      - record: siteparser:ai_actor_failure_ratio:rate1m
        expr: |
          sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor", outcome="failure"}[1m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor"}[1m])),
            0.001
          )

      - record: siteparser:ai_actor_failure_ratio:rate5m
        expr: |
          sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor", outcome="failure"}[5m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor"}[5m])),
            0.001
          )

      - record: siteparser:ai_actor_failure_ratio:rate30m
        expr: |
          sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor", outcome="failure"}[30m]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor"}[30m])),
            0.001
          )

      - record: siteparser:ai_actor_failure_ratio:rate6h
        expr: |
          sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor", outcome="failure"}[6h]))
          /
          clamp_min(
            sum(rate(ai_llm_primary_total{job="ai-ac-consumer", pipeline="actor"}[6h])),
            0.001
          )

  # -------------------------------------------------------------------------
  # Error ratio  — fraction of 5xx responses out of all responses
  # -------------------------------------------------------------------------
  - name: siteparser-slo-error-recording
    rules:
      - record: siteparser:api_error_ratio:rate1m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[1m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[1m])), 0.001)

      - record: siteparser:api_error_ratio:rate5m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[5m])), 0.001)

      - record: siteparser:api_error_ratio:rate30m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[30m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[30m])), 0.001)

      - record: siteparser:api_error_ratio:rate6h
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[6h]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[6h])), 0.001)

  # -------------------------------------------------------------------------
  # Latency bad ratio  — fraction of requests that exceeded the 500ms budget.
  # Uses le="0.5" bucket; route!="/metrics" excludes the scrape endpoint.
  # bad = 1 − (requests_within_budget / total_requests)
  # -------------------------------------------------------------------------
  - name: siteparser-slo-latency-recording
    rules:
      - record: siteparser:api_latency_bad_ratio:rate1m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[1m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[1m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate5m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[5m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[5m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate30m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[30m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[30m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate6h
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[6h]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[6h])), 0.001)
          )
