# SLO recording rules for SiteParser backend API.
#
# SLO targets (30-day window):
#   Availability : error rate  < 1%   (error budget  = 0.01)
#   Latency      : p95         < 500ms (latency budget = 0.05, i.e. ≤5% requests may exceed 500ms)
#
# Naming convention: siteparser:<signal>:<aggregation_window>
# Windows 1m / 5m cover the "page" (critical) burn-rate pair.
# Windows 5m / 30m cover the "ticket" (high) burn-rate pair.
# Windows 30m / 6h  cover the "slow-burn" (warning) pair.

groups:
  # -------------------------------------------------------------------------
  # Error ratio  — fraction of 5xx responses out of all responses
  # -------------------------------------------------------------------------
  - name: siteparser-slo-error-recording
    rules:
      - record: siteparser:api_error_ratio:rate1m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[1m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[1m])), 0.001)

      - record: siteparser:api_error_ratio:rate5m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[5m])), 0.001)

      - record: siteparser:api_error_ratio:rate30m
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[30m]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[30m])), 0.001)

      - record: siteparser:api_error_ratio:rate6h
        expr: |
          sum(rate(siteparser_http_requests_total{job="backend-api",status=~"5.."}[6h]))
          /
          clamp_min(sum(rate(siteparser_http_requests_total{job="backend-api"}[6h])), 0.001)

  # -------------------------------------------------------------------------
  # Latency bad ratio  — fraction of requests that exceeded the 500ms budget.
  # Uses le="0.5" bucket; route!="/metrics" excludes the scrape endpoint.
  # bad = 1 − (requests_within_budget / total_requests)
  # -------------------------------------------------------------------------
  - name: siteparser-slo-latency-recording
    rules:
      - record: siteparser:api_latency_bad_ratio:rate1m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[1m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[1m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate5m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[5m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[5m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate30m
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[30m]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[30m])), 0.001)
          )

      - record: siteparser:api_latency_bad_ratio:rate6h
        expr: |
          1 - (
            sum(rate(siteparser_http_request_duration_seconds_bucket{job="backend-api",le="0.5",route!="/metrics"}[6h]))
            /
            clamp_min(sum(rate(siteparser_http_request_duration_seconds_count{job="backend-api",route!="/metrics"}[6h])), 0.001)
          )
