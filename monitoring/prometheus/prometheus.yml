global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: backend-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-api:8080

  - job_name: backend-crawler
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-crawler:8081

  - job_name: backend-notifier
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-notifier:8082

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-service:9108

  - job_name: ai-ac-consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-ac-consumer:9109

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
