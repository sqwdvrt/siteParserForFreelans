name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check"
        required: true
        default: main

permissions:
  contents: read
  statuses: write

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Resolve target SHA
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              const ref = context.payload.inputs.ref;
              const { data } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.setOutput("target_sha", data.sha);
              return;
            }

            if (context.eventName === "pull_request") {
              core.setOutput("target_sha", context.payload.pull_request.head.sha);
              return;
            }

            core.setOutput("target_sha", context.sha);

  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (ai-service requirements)
        # CVE-2026-4539 (pygments): no fix version available as of 2026-03-28; transitive via sentence-transformers.
        # Remove the ignore once a patched pygments release is available.
        run: python -m pip_audit --no-deps -r ai-service/requirements.txt --ignore-vuln CVE-2026-4539

      - name: Run baseline checks
        env:
          PYTHON_BIN: python3.11
          GO_TOOLCHAIN: go1.25.10
          SECURITY_BASELINE_SKIP_PIP_AUDIT: "1"
        run: ./scripts/security_baseline_check.sh

  publish-gate-status:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only GITHUB_TOKEN, so publishing commit statuses would fail.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) }}
    needs:
      - resolve-target
      - security-baseline
    steps:
      - name: Publish gate status for target SHA
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        with:
          script: |
            const result = "${{ needs.security-baseline.result }}";
            const state = result === "success" ? "success" : "failure";
            const description = result === "success"
              ? "Security Baseline passed."
              : `Security Baseline finished with '${result}'.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: context.workflow,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
