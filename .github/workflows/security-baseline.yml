name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit (ai-service requirements)
        run: python -m pip_audit -r ai-service/requirements.txt

      - name: Run baseline checks
        env:
          PYTHON_BIN: python3.11
          GO_TOOLCHAIN: go1.25.7
          SECURITY_BASELINE_SKIP_PIP_AUDIT: "1"
        run: ./scripts/security_baseline_check.sh
