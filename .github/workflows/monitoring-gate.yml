name: Monitoring Gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check"
        required: true
        default: main

permissions:
  contents: read
  statuses: write

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Resolve target SHA
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              const ref = context.payload.inputs.ref;
              const { data } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.setOutput("target_sha", data.sha);
              return;
            }

            if (context.eventName === "pull_request") {
              core.setOutput("target_sha", context.payload.pull_request.head.sha);
              return;
            }

            core.setOutput("target_sha", context.sha);

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Validate monitoring and alerting configuration
        run: bash ./scripts/monitoring_config_check.sh

  publish-gate-status:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only GITHUB_TOKEN, so publishing commit statuses would fail.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) }}
    needs:
      - resolve-target
      - monitoring-config
    steps:
      - name: Publish gate status for target SHA
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        with:
          script: |
            const result = "${{ needs.monitoring-config.result }}";
            const state = result === "success" ? "success" : "failure";
            const description = result === "success"
              ? "Monitoring Gate passed."
              : `Monitoring Gate finished with '${result}'.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: context.workflow,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
