name: Test Gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Run backend unit tests
        run: |
          cd backend
          GOMODCACHE=$(pwd)/.gomodcache GOCACHE=$(pwd)/.gocache go test ./... -count=1

  ai-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI dependencies
        run: python -m pip install -r ai-service/requirements.txt

      - name: Run AI unit tests
        run: ./scripts/pytest_ai.sh -q

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Run security baseline checks
        run: ./scripts/security_baseline_check.sh

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: site_parser
          POSTGRES_PASSWORD: site_parser
          POSTGRES_DB: site_parser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U site_parser -d site_parser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://site_parser:site_parser@localhost:5432/site_parser?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      INTEGRATION_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI dependencies
        run: python -m pip install -r ai-service/requirements.txt

      - name: Apply database migrations
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg2

          dsn = os.environ["DATABASE_URL"]
          sql = open("backend/migrations/001_init.sql", "r", encoding="utf-8").read()

          last_err = None
          for _ in range(60):
              try:
                  with psycopg2.connect(dsn) as conn:
                      with conn.cursor() as cur:
                          cur.execute(sql)
                      conn.commit()
                  break
              except Exception as e:
                  last_err = e
                  time.sleep(2)
          else:
              raise SystemExit(f"failed to apply migrations: {last_err}")
          PY

      - name: Run backend integration tests
        run: |
          cd backend
          GOMODCACHE=$(pwd)/.gomodcache GOCACHE=$(pwd)/.gocache INTEGRATION_TESTS=1 \
            go test ./internal/adapter/postgres -count=1

      - name: Run AI integration tests
        run: |
          cd ai-service
          INTEGRATION_TESTS=1 python -m pytest -q tests/test_postgres_repository.py tests/test_match_repository.py
